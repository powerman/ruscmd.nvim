# jdx/mise-action installs only releases older than a day, so a newer one would fail CI.
min_version = '2026.10.19'

[settings]
lockfile = true # DO NOT FORGET TO `touch mise.lock` if mise.lock does not exist!
npm.package_manager = 'pnpm' # Avoid .mise/locks/** sidecars required by default aube.


[tools]
node = 'lts'
pnpm = 'latest'
'aqua:neovim/neovim' = ['latest', 'sub-0.1:latest']
lua = '5.1'

#--- Generate
# Universal markup converter
pandoc = 'latest'

#--- Format
# Opinionated Code Formatter.
prettier = 'latest'
# A TOML toolkit written in Rust.
taplo = 'latest'
# An extensible command line tool or library to format yaml files.
yamlfmt = 'latest'
# An opinionated Lua code formatter.
stylua = 'latest'

#--- Lint
# Static checker for GitHub Actions workflow files.
actionlint = 'latest'
# A blazing-fast modern Lua linter written in Rust.
'aqua:Kampfkarren/selene' = 'latest'

#--- Release
# A highly customizable Changelog Generator that follows Conventional Commit specifications.
git-cliff = 'latest'
# GitHub's official command line tool.
gh = 'latest'


[env]
NVIM_APPNAME = 'nvim' # Enforce Neovim app name to be 'nvim' for tests.


[tasks.'changelog:skip-commit']
description = 'Add commit hash to .cliffignore to exclude from CHANGELOG'
usage = 'arg "<commit>" help="Git revision (e.g. HEAD or a1b2c4d)"'
run = 'git rev-parse --verify "${usage_commit}" >> .cliffignore'

[tasks.'deps:tests:restore']
description = 'Restore lazy.nvim dependencies for tests'
depends = ['cachedir']
shell = 'bash -eo pipefail -c'
run = '''
nvim -l tests/run.lua --lazy-restore
# Workaround https://github.com/folke/lazy.nvim/issues/1787#issuecomment-2466916283.
git checkout -- tests/.config/nvim/lazy-lock.json
nvim -l tests/run.lua --lazy-restore
'''

[tasks.'deps:tests:update']
description = 'Update lazy.nvim dependencies for tests'
depends = ['cachedir']
run = 'nvim -l tests/run.lua --lazy-update'

[tasks.generate]
description = 'Generate everything'
depends = ['generate:*']

[tasks.fmt]
description = 'Format all files'
depends = ['fmt:*']

[tasks.lint]
description = 'Run all linters'
depends = ['lint:*']

[tasks.test]
description = 'Run all tests'
depends = ['test:*']

[tasks.default]
description = 'Run all formatters, linters and tests, generate documentation'
depends = ['fmt', 'lint', 'test', 'generate']

[tasks.ci]
description = 'Run all CI tasks'
depends = ['generate', 'fmt', 'lint', 'test']
# Is working tree clean after generate/fmt?
run = '! git status --porcelain | tee /dev/stderr | grep -q .'

[tasks.'fmt:markdown']
description = 'Format markdown files'
sources = ['**/*.md']
run = 'prettier --write "**/*.md"'

# Taplo doesn't respect .gitignore.
[tasks.'fmt:toml']
description = 'Format TOML files'
sources = ['**/*.toml']
env.RUST_LOG = 'warn' # Hide INFO logs of taplo.
run = "git ls-files -z -co --exclude-standard '*.toml' | xargs -0 -r taplo format"

[tasks.'fmt:yaml']
description = 'Format YAML files'
sources = ['**/*.yml', '**/*.yaml']
run = "git ls-files -z -co --exclude-standard '*.yml' '*.yaml' | xargs -0 -r yamlfmt"

[tasks.'generate:panvimdoc']
description = 'Generate panvimdoc documentation'
env.DIR = '.cache/panvimdoc'
depends = ['cachedir']
shell = 'bash -eo pipefail -c'
run = '''
VER="$(cat .panvimdoc.version)"
test -d $DIR || git clone https://github.com/kdheepak/panvimdoc $DIR
git -C $DIR checkout $VER 2>/dev/null || (git -C $DIR fetch && git -C $DIR checkout $VER)
GITHUB_ACTIONS= $DIR/panvimdoc.sh \
    --project-name "$(basename "$PWD" .nvim)" \
    --description "$(grep -E -v '^#|^$|^\[?!' README.md | head -n 1)" \
    --input-file README.md \
    --shift-heading-level-by -1
'''

[tasks.'fmt:stylua']
description = 'Format Lua code'
run = 'stylua .'

[tasks.'lint:workflows']
description = 'Lint GitHub Action workflows'
run = 'actionlint'

[tasks.'lint:markdown']
description = 'Lint markdown files'
wait_for = ['fmt:markdown']
sources = ['**/*.md']
run = 'prettier --check "**/*.md"'

[tasks.'lint:toml']
description = 'Check TOML files formatting'
wait_for = ['fmt:toml']
sources = ['**/*.toml']
env.RUST_LOG = 'warn' # Hide INFO logs of taplo.
run = "git ls-files -z -co --exclude-standard '*.toml' | xargs -0 -r taplo format --check"

[tasks.'lint:yaml']
description = 'Check YAML files formatting'
wait_for = ['fmt:yaml']
sources = ['**/*.yml', '**/*.yaml']
run = "git ls-files -z -co --exclude-standard '*.yml' '*.yaml' | xargs -0 -r yamlfmt -lint"

[tasks.'lint:stylua']
description = 'Check Lua code formatting'
run = 'stylua --check .'

[tasks.'lint:selene']
description = 'Lint Lua files'
run = 'selene .'

[tasks.'test:latest']
description = 'Run tests for a whole project with latest Neovim version'
tools.'aqua:neovim/neovim' = 'latest'
depends = ['deps:tests:install']
run = 'nvim -l tests/run.lua --minitest'

[tasks.'test:previous']
description = 'Run tests for a whole project with previous Neovim version'
tools.'aqua:neovim/neovim' = 'sub-0.1:latest'
depends = ['deps:tests:install']
run = 'nvim -l tests/run.lua --minitest'

# Parallel test tasks must not install dependencies concurrently:
# one of them may fail on partially installed lazy.nvim,
# and then Neovim in another one hangs on SIGTERM sent by mise.
[tasks.'deps:tests:install']
hide = true
depends = ['cachedir']
run = 'nvim -l tests/run.lua'

[tasks.cachedir]
hide = true
run = 'mkdir -p .cache'
